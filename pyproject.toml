[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "map-miner"
dynamic = ["version"]
description = "High-performance asynchronous Google Maps scraper using Playwright"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "lucifer-02" }
]
keywords = ["google-maps", "scraper", "playwright", "crawler", "asyncio"]
dependencies = [
    "aiohttp>=3.13.2",
    "beautifulsoup4>=4.12.0",
    "geopy>=2.4.1",
    "playwright==1.62.0",
    "polars>=1.35.2",
    "pydub>=0.25.1",
    "speechrecognition>=3.14.3",
    "vosk>=0.3.45",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ipython>=9.7.0",
    "notebook>=7.4.7",
    "pyrefly==1.3.2",
]

[tool.hatch.version]
path = "src/map_miner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/map_miner"]

[tool.hatch.build.targets.sdist]
exclude = ["/main.py"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py", "main.py"]
search-path = ["src"]

